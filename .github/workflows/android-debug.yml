name: Android debug APK

# Build the Capacitor Android debug APK (unsigned-release-quality debug build,
# signed with the auto-generated debug keystore — installable for testing).
# Artifacts live for 30 days; download from the run page or via `gh run download`.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/typora-engine
      - mobile-ci

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21 (Android Gradle Plugin 8.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build mobile renderer (dist-mobile)
        run: npm run build:mobile

      - name: Capacitor sync (copy web assets + plugins)
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          path=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: horsemd-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
